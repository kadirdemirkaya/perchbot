<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Perchbot giant</title>
    <link rel="stylesheet" href="giant.css" />
    <script src="giant.js" defer></script>
  </head>
  <body>
    <div id="clip" class="giant-clip">
      <div id="giant" class="giant">
        <div id="giant-char" class="buddy-character" aria-hidden="true"></div>
        <!-- "While you were away": the board it holds at its chest (text only). -->
        <div id="board" class="giant-board" hidden>
          <div class="giant-board-title"></div>
          <ul class="giant-board-lines"></ul>
        </div>
      </div>
    </div>
    <div id="rings" class="giant-rings"></div>
    <div id="bubble" class="giant-bubble"><span></span></div>
    <!-- Stretch break: the seconds for the eyes, counted down. -->
    <div id="count" class="giant-count"></div>
  </body>
</html>
