<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Perchbot</title>
    <link rel="stylesheet" href="overlay.css" />
    <script src="lib/interaction.js" defer></script>
    <script src="lib/crew.js" defer></script>
    <script src="lib/fun.js" defer></script>
    <script src="lib/pet.js" defer></script>
    <script src="lib/perf.js" defer></script>
    <script src="lib/chat-match.js" defer></script>
    <!-- Sounds (app/features.js): off by default, the Sound setting switches them on. -->
    <script src="lib/sound.js" defer></script>
    <script src="pet-view.js" defer></script>
    <script src="bug-view.js" defer></script>
    <script src="ghost-view.js" defer></script>
    <script src="crew-view.js" defer></script>
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <!-- Menu icons: original line drawings for this project (24x24 grid). -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">

      <symbol id="i-eye" viewBox="0 0 24 24">

        <circle cx="12" cy="12" r="3" />

      <symbol id="i-eye-off" viewBox="0 0 24 24">

        <circle cx="12" cy="12" r="3" />
        <path d="M3.5 3l17 18" />

      <symbol id="i-corner" viewBox="0 0 24 24">

      <symbol id="i-gear" viewBox="0 0 24 24">

        <circle cx="12" cy="12" r="6.5" />

      <!-- Pip's face: pointed ears, slit eyes, nose and whiskers. -->
      <symbol id="i-cat" viewBox="0 0 24 24">

      </symbol>
      <symbol id="i-cube" viewBox="0 0 24 24">
        <path d="M12 3L21 7.5V16.5L12 21L3 16.5V7.5Z" fill="#FFF6E8" stroke="#2A2650" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M3 7.5L12 12L21 7.5M12 12V21" fill="none" stroke="#2A2650" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M12 12L21 7.5V16.5L12 21Z" fill="#EADCC4" stroke="#2A2650" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M5.5 11L9.5 13M5.5 14L9.5 16" fill="none" stroke="#B3A8F7" stroke-width="1.2" stroke-linecap="round" />

      <symbol id="i-rocket" viewBox="0 0 24 36">

        <path d="M7 15L3 22.5L7.5 21ZM17 15L21 22.5L16.5 21Z" fill="#8C7BEA" stroke="#2A2650" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M9 21.5Q12 31 15 21.5Z" fill="#FF9A3C" stroke="#2A2650" stroke-width="1.4" stroke-linejoin="round" />
      </symbol>
      <!-- A pull request: an envelope (body, flap, seal). -->
      <symbol id="i-env" viewBox="0 0 32 24">
        <rect x="2" y="7" width="28" height="15" rx="2" fill="#FFF6E8" stroke="#2A2650" stroke-width="2" stroke-linejoin="round" />
        <path d="M3 21L13.5 13.5M29 21L18.5 13.5" fill="none" stroke="#E2D5BE" stroke-width="1.6" stroke-linecap="round" />

      <symbol id="i-env-flap" viewBox="0 0 32 24">

      <symbol id="i-env-seal" viewBox="0 0 32 24">

      <!-- A plan up for approval: a blueprint between two rolls, and the stamp it gets. -->

        <rect x="1.5" y="2" width="7" height="42" rx="3.5" fill="#8AB6FF" stroke="#2A2650" stroke-width="2" />
        <rect x="55.5" y="2" width="7" height="42" rx="3.5" fill="#8AB6FF" stroke="#2A2650" stroke-width="2" />

      <symbol id="i-stamp" viewBox="0 0 64 46">
        <circle cx="45" cy="30" r="9" fill="#FFF6E8" fill-opacity=".25" stroke="#FF5A6E" stroke-width="2.6" />
        <path d="M40.5 30.5L44 34L50 26.5" fill="none" stroke="#FF5A6E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <!-- An MCP tool: a socket (its light filled by the page's CSS) and a plug on a cable. -->
      <symbol id="i-socket" viewBox="0 0 44 30">
        <rect x="2" y="6" width="15" height="20" rx="3.5" fill="#4A4380" stroke="#2A2650" stroke-width="2" />
        <rect x="5.5" y="13" width="2.2" height="6" rx="1" fill="#2A2650" />
        <rect x="11.5" y="13" width="2.2" height="6" rx="1" fill="#2A2650" />
      </symbol>
      <symbol id="i-socket-led" viewBox="0 0 44 30">
        <circle cx="9.5" cy="9.5" r="1.8" stroke="#2A2650" stroke-width="0.8" />
      </symbol>
      <symbol id="i-plug" viewBox="0 0 44 30">
        <path d="M27 16Q36 16 38 22T43 29" fill="none" stroke="#2A2650" stroke-width="2.4" stroke-linecap="round" />
        <path d="M17.5 12.5H20M17.5 19.5H20" fill="none" stroke="#C9C3E8" stroke-width="2.2" stroke-linecap="round" />
        <rect x="19.5" y="10" width="8" height="12" rx="2.5" fill="#FFF6E8" stroke="#2A2650" stroke-width="2" />
      </symbol>
      <!-- Terminal commands (app/moments.js): merge (two puzzle pieces), a sparkle, a new branch
           (pot, stem, twig), stash (a note), pull (a fish, a bucket, splash), force (a siren and its
           beams), rewind (a clock and its hands), install (a parcel and its flaps). -->
      <symbol id="i-piece-a" viewBox="0 0 26 24">
        <path d="M2 6H12V9.6A2.5 2.5 0 1 1 12 14.4V18H2Z" fill="#8C7BEA" stroke="#2A2650" stroke-width="1.8" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-piece-b" viewBox="0 0 26 24">
        <path d="M12.6 6H24V18H12.6V14.4A2.5 2.5 0 1 0 12.6 9.6Z" fill="#4FD6B4" stroke="#2A2650" stroke-width="1.8" stroke-linejoin="round" />

      <symbol id="i-stem" viewBox="0 0 24 32">

        <path d="M12 22.5V8" fill="none" stroke="#4FD6B4" stroke-width="1.6" stroke-linecap="round" />
        <path d="M12 8.5Q8 7.5 7.5 3.5Q11.5 4 12 8.5Z" fill="#4FD6B4" stroke="#2A2650" stroke-width="1.4" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-twig" viewBox="0 0 24 32">
        <path d="M12 16Q15 14.5 17 11" fill="none" stroke="#2A2650" stroke-width="3" stroke-linecap="round" />

      <symbol id="i-note" viewBox="0 0 16 16">
        <path d="M2.5 3.5H11L13.5 6V12.5H2.5Z" fill="#FFF6E8" stroke="#2A2650" stroke-width="1.4" stroke-linejoin="round" />
        <path d="M5 7.5H11M5 10H9.5" fill="none" stroke="#B3A8F7" stroke-width="1.2" stroke-linecap="round" />

      <symbol id="i-fish" viewBox="0 0 28 28">
        <path d="M8 8Q12.5 3.5 18.5 8Q12.5 12.5 8 8Z" fill="#FFD25A" stroke="#2A2650" stroke-width="1.6" stroke-linejoin="round" />

      <symbol id="i-bucket" viewBox="0 0 28 28">

      <symbol id="i-siren" viewBox="0 0 24 24">
        <rect x="5.5" y="16.5" width="13" height="4" rx="1.2" fill="#3A3566" stroke="#2A2650" stroke-width="1.6" />
        <path d="M7 16.5V12A5 5 0 0 1 17 12V16.5Z" fill="#FF5A6E" stroke="#2A2650" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M9.5 12.5A2.5 2.5 0 0 1 11.5 10" fill="none" stroke="#FFF6E8" stroke-width="1.3" stroke-linecap="round" />
      </symbol>
      <symbol id="i-siren-beam" viewBox="0 0 24 24">
        <path d="M12 13L0 8V18ZM12 13L24 8V18Z" fill="#FF5A6E" opacity=".4" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="#FFF6E8" stroke="#2A2650" stroke-width="2" />
        <path d="M12 4.5V6M19.5 12H18M12 19.5V18M4.5 12H6" fill="none" stroke="#B3A8F7" stroke-width="1.4" stroke-linecap="round" />
        <path d="M3.2 6.2A10.2 10.2 0 0 1 7.5 2.6" fill="none" stroke="#8C7BEA" stroke-width="1.6" stroke-linecap="round" />
        <path d="M2 4.4L3.2 6.6L5.6 5.9" fill="none" stroke="#8C7BEA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-clock-long" viewBox="0 0 24 24">
        <path d="M12 12V6" fill="none" stroke="#2A2650" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-clock-short" viewBox="0 0 24 24">
        <path d="M12 12H15.5" fill="none" stroke="#FF5A6E" stroke-width="2" stroke-linecap="round" />
        <circle cx="12" cy="12" r="1.3" fill="#2A2650" />
      </symbol>
      <symbol id="i-box" viewBox="0 0 30 28">
        <rect x="4" y="12" width="22" height="14" rx="1.5" fill="#E9C08A" stroke="#2A2650" stroke-width="1.8" />
        <rect x="13" y="12" width="4" height="14" fill="#F3D9A8" />
        <path d="M4 12H26" fill="none" stroke="#2A2650" stroke-width="1.8" />
        <path d="M7 22.5H10.5" fill="none" stroke="#D9A766" stroke-width="1.4" stroke-linecap="round" />
      </symbol>
      <symbol id="i-box-flaps" viewBox="0 0 30 28">
        <path d="M4.5 12H15L11 5.5L1 7.5Z" fill="#D9A766" stroke="#2A2650" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M15 12H25.5L29 7.5L19 5.5Z" fill="#D9A766" stroke="#2A2650" stroke-width="1.6" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.7a4.3 4.3 0 0 1 7.5 2.6c0 5.6-7.5 10.2-7.5 10.2z" />
      </symbol>
      <!-- Recent steps: a page with lines (read), a pencil (write), a prompt (run). -->
      <symbol id="i-step-read" viewBox="0 0 24 24">
        <path d="M6 3.5h8.5l3.5 3.5v13.5H6z" />
        <path d="M9 11h6M9 14.5h6M9 18h4" />
      </symbol>
      <symbol id="i-step-write" viewBox="0 0 24 24">
        <path d="M4.5 19.5l1-4.5L16 4.5l3.5 3.5L9 18.5z" />
        <path d="M13.5 7l3.5 3.5" />
      </symbol>
      <symbol id="i-step-run" viewBox="0 0 24 24">
        <path d="M5 7l5 5-5 5" />
        <path d="M12.5 18h7" />
      </symbol>
      <!-- Chat: a round speech bubble with a question mark. -->
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path d="M12 4c4.7 0 8.5 3.1 8.5 7s-3.8 7-8.5 7c-1 0-2-.1-2.9-.4L5 19.5l1.2-3.6C4.5 14.6 3.5 12.9 3.5 11 3.5 7.1 7.3 4 12 4z" />
        <path d="M10 9.3a2 2 0 1 1 2.7 1.9c-.5.2-.7.6-.7 1v.4" />
        <path d="M12 14.9v.1" />
      </symbol>
      <!-- Sound: a small speaker with two waves (off: crossed out). -->
      <symbol id="i-sound" viewBox="0 0 24 24">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
        <path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.8a7.4 7.4 0 0 1 0 10.4" />
      </symbol>
      <symbol id="i-sound-off" viewBox="0 0 24 24">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
        <path d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M7 7l10 10M17 7L7 17" />
      </symbol>
      <!-- Follow Windows: a recycle bin (off: crossed out). -->
      <symbol id="i-bin" viewBox="0 0 24 24">
        <path d="M4.5 7h15" />
        <path d="M9.5 7V4.5h5V7" />
        <path d="M6.5 7l1 13h9l1-13" />
        <path d="M10.5 10.5v6M13.5 10.5v6" />
      </symbol>
      <symbol id="i-bin-off" viewBox="0 0 24 24">
        <path d="M4.5 7h15" />
        <path d="M9.5 7V4.5h5V7" />
        <path d="M6.5 7l1 13h9l1-13" />
        <path d="M3.5 3l17 18" />
      </symbol>
      <symbol id="i-power" viewBox="0 0 24 24">
        <path d="M12 3v8.5" />
        <path d="M6.6 6.6a7.6 7.6 0 1 0 10.8 0" />
      </symbol>
    </svg>

    <div id="stage" class="stage side-left">
      <div id="slot" class="slot">
        <div id="bubble" class="bubble" role="status" aria-live="polite">
          <span id="bubble-text" class="bubble-text"></span>
          <!-- "What's this?": the answers it offers (buttons, only then). -->
          <span id="bubble-choices" class="bubble-choices"></span>
        </div>
        <!-- The last files read / written and commands run, above the bubble. -->
        <div id="trail" class="trail" aria-hidden="true"></div>
        <div id="skill-tag" class="skill-tag" aria-hidden="true">
          <svg aria-hidden="true"><use href="#i-book" /></svg>
          <span id="skill-name"></span>
        </div>
        <div id="duel-hud" class="duel-hud" aria-hidden="true"></div>
        <div id="character" class="buddy-character" data-state="idle"></div>
        <!-- One buddy per account: which account this one is for. -->
        <div id="account-tag" class="account-tag" aria-hidden="true"></div>
        <div id="fx" class="fx" aria-hidden="true"></div>
      </div>
      <!-- Sub-agent minis (crew-view.js). -->
      <div id="actors" class="actors" aria-hidden="true"></div>
      <!-- Duel: catches every click in the window while swords are out. -->
      <div id="duel-pad" class="duel-pad" aria-hidden="true"></div>
      <!-- Hits, sparks, whip cracks at the cursor. -->
      <div id="fx-top" class="fx-top" aria-hidden="true"></div>
      <nav id="menu" class="menu" aria-label="Perchbot"></nav>
      <!-- The chat panel: hands commands (Windows) and ready-made questions, buttons only. -->
      <section id="chat" class="chat" aria-hidden="true">
        <div class="chat-card">
          <div class="chat-head">
            <span id="chat-title" class="chat-title"></span>
            <button id="chat-close" class="chat-close" type="button" tabindex="-1">
              <svg aria-hidden="true"><use href="#i-close" /></svg>
            </button>
          </div>
          <div id="chat-cmds" class="chat-cmds" hidden></div>
          <div id="chat-list" class="chat-list"></div>
        </div>
      </section>
      <div id="tooltip" class="tooltip" role="tooltip"></div>
    </div>
  </body>
</html>
