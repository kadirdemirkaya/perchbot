<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Agent Buddy</title>
    <link rel="stylesheet" href="overlay.css" />
    <script src="lib/interaction.js" defer></script>
    <script src="lib/crew.js" defer></script>
    <script src="lib/fun.js" defer></script>
    <script src="lib/pet.js" defer></script>
    <script src="pet-view.js" defer></script>
    <script src="crew-view.js" defer></script>
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <!-- Menu icons: original line drawings for this project (24x24 grid). -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-bubble" viewBox="0 0 24 24">
        <path d="M5 4.5h14a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-7l-4.5 3.5V17H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z" />
        <path d="M8 9.5h8M8 12.5h5" />
      </symbol>
      <symbol id="i-bubble-off" viewBox="0 0 24 24">
        <path d="M5 4.5h14a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-7l-4.5 3.5V17H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z" />
        <path d="M3.5 3l17 18" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
        <path d="M3.5 3l17 18" />
      </symbol>
      <symbol id="i-corner" viewBox="0 0 24 24">
        <path d="M20.5 12.5v8h-8" />
        <path d="M20 20L8 8" />
        <path d="M3.5 7V3.5H7" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <circle cx="12" cy="12" r="6.5" />
        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M3 5.5Q7.5 3.5 12 6v13q-4.5-2.5-9-.5z" />
        <path d="M21 5.5Q16.5 3.5 12 6v13q4.5-2.5 9-.5z" />
      </symbol>
      <!-- Robo's toy wooden sword: rounded tip, grain line, cross guard, grip, pommel; tilted. -->
      <symbol id="i-sword" viewBox="0 0 24 24">
        <g transform="rotate(45 12 12)">
          <path d="M10.1 14.2V5.1a1.9 1.9 0 0 1 3.8 0v9.1" />
          <path d="M12 6.4v5.4" stroke-width="1.2" />
          <path d="M7.6 14.6h8.8" />
          <path d="M12 15v4.2" />
          <circle cx="12" cy="20.6" r="1.3" />
        </g>
      </symbol>
      <!-- Pip's face: pointed ears, slit eyes, nose and whiskers. -->
      <symbol id="i-cat" viewBox="0 0 24 24">
        <path d="M4.8 10.2V4.3l4.2 3.2h6l4.2-3.2v5.9c0 5-3.2 8.6-7.2 8.6s-7.2-3.6-7.2-8.6z" />
        <path d="M9.2 11.2v1.4M14.8 11.2v1.4" />
        <path d="M11.1 14.3h1.8L12 15.3z" />
        <path d="M1.8 12.9l4 .7M1.8 16.1l4-.7M22.2 12.9l-4 .7M22.2 16.1l-4-.7" stroke-width="1.4" />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.7a4.3 4.3 0 0 1 7.5 2.6c0 5.6-7.5 10.2-7.5 10.2z" />
      </symbol>
      <symbol id="i-power" viewBox="0 0 24 24">
        <path d="M12 3v8.5" />
        <path d="M6.6 6.6a7.6 7.6 0 1 0 10.8 0" />
      </symbol>
    </svg>

    <div id="stage" class="stage side-left">
      <div id="slot" class="slot">
        <div id="bubble" class="bubble" role="status" aria-live="polite">
          <span id="bubble-text" class="bubble-text"></span>
        </div>
        <div id="skill-tag" class="skill-tag" aria-hidden="true">
          <svg aria-hidden="true"><use href="#i-book" /></svg>
          <span id="skill-name"></span>
        </div>
        <div id="duel-hud" class="duel-hud" aria-hidden="true"></div>
        <div id="character" class="buddy-character" data-state="idle"></div>
        <div id="fx" class="fx" aria-hidden="true"></div>
      </div>
      <!-- Sub-agent minis (crew-view.js). -->
      <div id="actors" class="actors" aria-hidden="true"></div>
      <!-- Duel: catches every click in the window while swords are out. -->
      <div id="duel-pad" class="duel-pad" aria-hidden="true"></div>
      <!-- Hits, sparks, whip cracks at the cursor. -->
      <div id="fx-top" class="fx-top" aria-hidden="true"></div>
      <nav id="menu" class="menu" aria-label="Agent Buddy"></nav>
      <div id="tooltip" class="tooltip" role="tooltip"></div>
    </div>
  </body>
</html>
