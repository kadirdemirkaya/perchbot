<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="rbm" role="img" aria-label="A little helper robot">
  <!--
    "Robo's kids": the little robot shown for each sub-agent.
    Original artwork drawn for this project. License: MIT (same as the repo).
    A child of Robo: a big round head, big eyes, a short spring antenna with a
    round bulb, a small body and stubby legs. Drawn at two thirds of Robo's
    size. Each kid wears its own colour: shapes with an rbm-c-* class take
    their colour from mini.css (data-tint), the fill attributes are the
    default (mint) kid. See characters/robot/DESIGN.md.

    Rig (pivots in mini.css):
      rbm-figure   walk bob, hops, report jump   (pivot: feet)
      rbm-leg-*    walking steps, tuck in flight (pivot: hip);  rbm-flame-*  sole thrusters
      rbm-head     nod, tilt, talk               (pivot: neck)
      rbm-arm      far arm: salute, holds the skill book (pivot: shoulder)
      rbm-arm-front, rbm-forearm-front  types on the laptop
      rbm-laptop   open in front while working; rbm-lid hinge
      rbm-book     skill book (hidden unless the app sets data-skill)
      rbm-note     the note it hands over (report, chat)
      rbm-sword    a toy wooden sword (a visitor sparring with Robo: data-spar)
    Elements marked data-nohit never count as "the character" for the mouse.
  -->
  <defs>
    <clipPath id="rbm-screen-clip">
      <rect x="134" y="108" width="40" height="28" rx="2"/>
    </clipPath>
    <clipPath id="rbm-head-clip">
      <path d="M58 28 H118 Q138 28 138 50 L134 88 Q133 102 118 102 H58 Q43 102 42 88 L38 50 Q38 28 58 28 Z"/>
    </clipPath>
  </defs>

  <ellipse class="rbm-shadow" data-nohit="" cx="90" cy="187" rx="40" ry="5" fill="#2A2650" opacity=".16"/>

  <g class="rbm-figure">
    <!-- stubby legs, little boots and their flames -->
    <g class="rbm-leg rbm-leg-l">
      <g class="rbm-flame rbm-flame-l" data-nohit="">
        <path d="M71 181 Q71.5 188.5 77 196 Q82.5 188.5 83 181 Z" fill="#FF9A3C"/>
        <path d="M73.5 181 Q74.5 186.5 77 190.5 Q79.5 186.5 80.5 181 Z" fill="#FFD25A"/>
      </g>
      <rect class="rbm-c-limb" x="72" y="148" width="11" height="21" rx="5" fill="#3FB597" stroke="#2A2650" stroke-width="3"/>
      <path class="rbm-c-boot" d="M67 181 V176 Q67 168 74.5 168 H80 Q87.5 168 87.5 176 V181 Z" fill="#2F6E61" stroke="#2A2650" stroke-width="3" stroke-linejoin="round"/>
      <rect class="rbm-c-accent" x="65.5" y="177.5" width="24" height="5" rx="2.5" fill="#8C7BEA" stroke="#2A2650" stroke-width="3"/>
    </g>
    <g class="rbm-leg rbm-leg-r">
      <g class="rbm-flame rbm-flame-r" data-nohit="">
        <path d="M93 181 Q93.5 188.5 99 196 Q104.5 188.5 105 181 Z" fill="#FF9A3C"/>
        <path d="M95.5 181 Q96.5 186.5 99 190.5 Q101.5 186.5 102.5 181 Z" fill="#FFD25A"/>
      </g>
      <rect class="rbm-c-limb" x="93" y="148" width="11" height="21" rx="5" fill="#3FB597" stroke="#2A2650" stroke-width="3"/>
      <path class="rbm-c-boot" d="M89 181 V176 Q89 168 96.5 168 H102 Q109.5 168 109.5 176 V181 Z" fill="#2F6E61" stroke="#2A2650" stroke-width="3" stroke-linejoin="round"/>
      <rect class="rbm-c-accent" x="87.5" y="177.5" width="24" height="5" rx="2.5" fill="#8C7BEA" stroke="#2A2650" stroke-width="3"/>
    </g>

    <!-- small round body with a belly light -->
    <path class="rbm-c-body" d="M71 104 H105 Q114 104 115 113 L116 139 Q116 153 103 153 H73 Q60 153 60 139 L61 113 Q62 104 71 104 Z" fill="#5ED3B3" stroke="#2A2650" stroke-width="3.4" stroke-linejoin="round"/>
    <path class="rbm-c-shade-line" d="M110 114 L111 139 Q111 147 103 148.5" fill="none" stroke="#3FB597" stroke-width="5" stroke-linecap="round"/>
    <circle cx="88" cy="128" r="12" fill="#FFF6E8" stroke="#2A2650" stroke-width="2.6"/>
    <path class="rbm-led rbm-c-accent" d="M88 134 Q81 129 81.6 125 Q82.3 121.2 85.6 121.6 Q87.3 121.9 88 123.6 Q88.7 121.9 90.4 121.6 Q93.7 121.2 94.4 125 Q95 129 88 134 Z" fill="#8C7BEA" stroke="#2A2650" stroke-width="1.6" stroke-linejoin="round"/>

    <g class="rbm-head">
      <!-- short spring antenna with a round bulb -->
      <path d="M88 30 V26.5 L83.5 24.5 L92.5 22 L83.5 19.5 L88 17.5" fill="none" stroke="#2A2650" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="88" cy="12.5" r="5.6" fill="#FFD25A" stroke="#2A2650" stroke-width="2.4"/>
      <circle cx="86.4" cy="10.9" r="1.5" fill="#FFF6E8"/>

      <!-- big head: wider at the brow, like its parent, but rounder -->
      <path class="rbm-c-body" d="M58 28 H118 Q138 28 138 50 L134 88 Q133 102 118 102 H58 Q43 102 42 88 L38 50 Q38 28 58 28 Z" fill="#5ED3B3"/>
      <g clip-path="url(#rbm-head-clip)">
        <ellipse class="rbm-c-shade" cx="146" cy="98" rx="36" ry="38" fill="#3FB597"/>
        <path d="M47 44 Q49 34 60 33.5 H78" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="3.4" stroke-linecap="round"/>
      </g>
      <path d="M58 28 H118 Q138 28 138 50 L134 88 Q133 102 118 102 H58 Q43 102 42 88 L38 50 Q38 28 58 28 Z" fill="none" stroke="#2A2650" stroke-width="3.4" stroke-linejoin="round"/>

      <!-- face screen -->
      <rect x="50" y="40" width="76" height="52" rx="19" fill="#FFF6E8" stroke="#2A2650" stroke-width="2.6"/>
      <g class="rbm-face">
        <g class="rbm-eyes">
          <ellipse cx="72" cy="65" rx="7.4" ry="9" fill="#2A2650"/>
          <ellipse cx="104" cy="65" rx="7.4" ry="9" fill="#2A2650"/>
          <circle cx="74.6" cy="61.4" r="2.6" fill="#FFFFFF"/>
          <circle cx="106.6" cy="61.4" r="2.6" fill="#FFFFFF"/>
          <circle cx="69.6" cy="69" r="1.2" fill="#FFFFFF"/>
          <circle cx="101.6" cy="69" r="1.2" fill="#FFFFFF"/>
        </g>
        <g class="rbm-eyes-happy" fill="none" stroke="#2A2650" stroke-width="3.6" stroke-linecap="round">
          <path d="M65 68 Q72 58.5 79 68"/>
          <path d="M97 68 Q104 58.5 111 68"/>
        </g>
        <path class="rbm-mouth" d="M84 80 Q88 83.8 92 80" fill="none" stroke="#2A2650" stroke-width="2.8" stroke-linecap="round"/>
        <path class="rbm-mouth-grin" d="M82 78.5 Q88 88.5 94 78.5 Z" fill="#2A2650" stroke="#2A2650" stroke-width="1.8" stroke-linejoin="round"/>
        <ellipse class="rbm-mouth-talk" cx="88" cy="81" rx="3.2" ry="3.6" fill="#2A2650"/>
        <ellipse cx="59.5" cy="79" rx="4.4" ry="2.8" fill="#FF9DB0" opacity=".85"/>
        <ellipse cx="116.5" cy="79" rx="4.4" ry="2.8" fill="#FF9DB0" opacity=".85"/>
      </g>
      <!-- round ear knobs -->
      <circle class="rbm-c-accent" cx="38" cy="66" r="7" fill="#8C7BEA" stroke="#2A2650" stroke-width="3"/>
      <circle class="rbm-c-accent" cx="138" cy="66" r="7" fill="#8C7BEA" stroke="#2A2650" stroke-width="3"/>
    </g>

    <!-- far arm: salutes when reporting, holds the skill book -->
    <g class="rbm-arm">
      <rect class="rbm-c-limb" x="53" y="106" width="10" height="34" rx="5" fill="#3FB597" stroke="#2A2650" stroke-width="3"/>
      <circle cx="58" cy="142" r="6.4" fill="#FFF6E8" stroke="#2A2650" stroke-width="3"/>
      <circle class="rbm-c-accent" cx="58" cy="112" r="6.6" fill="#8C7BEA" stroke="#2A2650" stroke-width="3"/>
      <!-- skill book, open, held up in front of the belly -->
      <g class="rbm-book" data-nohit="">
        <path d="M61 135 Q69 131 77 134 V151 Q69 148 61 152 Z" fill="#FFF6E8" stroke="#2A2650" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M77 134 Q85 131 93 135 V152 Q85 148 77 151 Z" fill="#FFFFFF" stroke="#2A2650" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M64.5 139 Q69 137.4 73.5 138.6 M64.5 143.5 Q69 141.9 73.5 143.1 M80.5 138.6 Q85 137.4 89.5 139 M80.5 143.1 Q85 141.9 89.5 143.5" fill="none" stroke="#B3A8F7" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M60 151.5 Q69 147.2 77 150.6 Q85 147.2 94 151.5 L94 154 Q85 150 77 153.4 Q69 150 60 154 Z" fill="#4FD6B4" stroke="#2A2650" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- laptop -->
    <g class="rbm-laptop">
      <g class="rbm-lid">
        <rect x="129" y="103" width="50" height="38" rx="5" fill="#3A3566" stroke="#2A2650" stroke-width="3.2"/>
        <rect x="134" y="108" width="40" height="28" rx="2" fill="#141228"/>
        <g clip-path="url(#rbm-screen-clip)" data-nohit="">
          <g class="rbm-code">
            <rect x="137" y="111" width="14" height="3.4" rx="1.7" fill="#8C7BEA"/>
            <rect x="153" y="111" width="10" height="3.4" rx="1.7" fill="#5ED3B3"/>
            <rect x="142" y="118" width="22" height="3.4" rx="1.7" fill="#5ED3B3"/>
            <rect x="142" y="125" width="12" height="3.4" rx="1.7" fill="#FFD25A"/>
            <rect x="137" y="132" width="18" height="3.4" rx="1.7" fill="#FF9DB0"/>
            <rect x="137" y="139" width="14" height="3.4" rx="1.7" fill="#8C7BEA"/>
            <rect x="153" y="139" width="10" height="3.4" rx="1.7" fill="#5ED3B3"/>
            <rect x="142" y="146" width="22" height="3.4" rx="1.7" fill="#5ED3B3"/>
            <rect x="142" y="153" width="12" height="3.4" rx="1.7" fill="#FFD25A"/>
            <rect x="137" y="160" width="18" height="3.4" rx="1.7" fill="#FF9DB0"/>
          </g>
        </g>
      </g>
      <path d="M124 141 H184 L190 149 Q191 152 187 152 H121 Q117 152 118 149 Z" fill="#D9D6EA" stroke="#2A2650" stroke-width="3.2" stroke-linejoin="round"/>
    </g>

    <!-- near arm: types -->
    <g class="rbm-arm-front">
      <rect class="rbm-c-limb" x="113" y="106" width="10" height="24" rx="5" fill="#3FB597" stroke="#2A2650" stroke-width="3"/>
      <g class="rbm-forearm-front">
        <rect class="rbm-c-limb" x="113" y="124" width="10" height="19" rx="5" fill="#3FB597" stroke="#2A2650" stroke-width="3"/>
        <circle class="rbm-c-limb" cx="118" cy="128" r="3.6" fill="#3FB597"/>
        <!-- a visitor's toy sword: rounded tip, held in this hand while sparring -->
        <g class="rbm-sword" data-nohit="">
          <rect x="115.5" y="138" width="5" height="11" rx="1.8" fill="#2A2650"/>
          <rect x="110" y="148.5" width="16" height="4.4" rx="2.2" fill="#8C7BEA" stroke="#2A2650" stroke-width="2"/>
          <path d="M115.2 152.9 H120.8 V178 Q120.8 183.2 118 185.6 Q115.2 183.2 115.2 178 Z" fill="#D9BC8C" stroke="#2A2650" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M117 156 V177" stroke="#EDD9B3" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <circle cx="118" cy="144" r="6.4" fill="#FFF6E8" stroke="#2A2650" stroke-width="3"/>
        <!-- the note it hands over: a folded page -->
        <g class="rbm-note" data-nohit="">
          <path d="M121 133 H135 L139 137 V153 H121 Z" fill="#FFFFFF" stroke="#2A2650" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M135 133 V137 H139" fill="none" stroke="#2A2650" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M124.5 141 H134.5 M124.5 145 H134.5 M124.5 149 H131" stroke="#B3A8F7" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>
      <circle class="rbm-c-accent" cx="118" cy="112" r="6.6" fill="#8C7BEA" stroke="#2A2650" stroke-width="3"/>
    </g>
  </g>
</svg>
